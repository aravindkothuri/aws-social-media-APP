server.port=${PORT:8080}

# Database Configuration (Defaults to H2 for instant local run, swap easily for PostgreSQL/MySQL in Docker)
spring.datasource.url=${DB_URL:jdbc:h2:mem:socialdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (for debugging inside Docker/Local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
