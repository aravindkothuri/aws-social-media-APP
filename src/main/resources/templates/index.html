<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pulse | Modern Social Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">PULSE</h1>
            <div class="flex items-center space-x-3">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" 
                     class="w-8 h-8 rounded-full border border-indigo-500 object-cover" alt="Profile">
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">

        <!-- Create Post Card -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <form action="/posts" method="POST" class="space-y-4">
                <div class="flex space-x-3">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" 
                         class="w-10 h-10 rounded-full object-cover mt-1" alt="Avatar">
                    <div class="flex-1 space-y-3">
                        <input type="text" name="authorName" placeholder="Your Name" required
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                        <textarea name="content" rows="3" placeholder="What's happening in your infrastructure universe?" required
                                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-200 resize-none"></textarea>
                        <input type="url" name="imageUrl" placeholder="Optional Image URL (Unsplash link, etc.)"
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                        Publish Post
                    </button>
                </div>
            </form>
        </section>

        <!-- Feed Stream -->
        <div class="space-y-6">
            <div th:each="post : ${posts}" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <!-- Post Header -->
                <div class="p-4 flex items-center space-x-3">
                    <img th:src="${post.authorAvatar}" class="w-10 h-10 rounded-full object-cover border border-slate-700" alt="Author">
                    <div>
                        <h3 class="font-semibold text-sm text-slate-200" th:text="${post.authorName}">Author Name</h3>
                        <span class="text-xs text-slate-500" th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm')}">Time</span>
                    </div>
                </div>

                <!-- Post Content -->
                <div class="px-4 pb-3 text-slate-300 text-sm leading-relaxed" th:text="${post.content}">
                    Post text goes here...
                </div>

                <!-- Post Image (Unsplash) -->
                <div th:if="${post.imageUrl}" class="w-full bg-slate-950 max-h-96 overflow-hidden">
                    <img th:src="${post.imageUrl}" class="w-full h-full object-cover hover:scale-105 transition duration-500" alt="Post Image">
                </div>

                <!-- Post Actions -->
                <div class="p-4 flex items-center justify-between border-t border-slate-800/60 bg-slate-950/40">
                    <form th:action="@{/posts/{id}/like(id=${post.id})}" method="POST">
                        <button type="submit" class="flex items-center space-x-2 text-slate-400 hover:text-rose-400 transition text-sm font-medium">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span th:text="${post.likes}">0</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
